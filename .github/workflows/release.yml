name: release

# Pushing a v* tag builds every platform and publishes a GitHub release.
# Running it by hand (Actions tab → release → Run workflow) does a dry run:
# it builds everything and attaches the archives to the run, but publishes
# nothing.
#
# The terminal app is cross-compiled by GoReleaser. The desktop app
# (katTasks-gui) needs cgo on Linux and macOS, so the gui job builds it on
# each OS first; GoReleaser then adds those archives to the same release and
# checksums.txt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0
  TASK_VERSION: v3.54.0

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, test: true }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: amd64, runner: ubuntu-24.04, installer: true } # no cgo: cross-compiled
          - { os: windows, arch: arm64, runner: ubuntu-24.04 }
          - { os: darwin, arch: universal, runner: macos-latest }
    name: gui (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: katTasks-gui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for git describe on dry runs

      - uses: actions/setup-go@v7
        with:
          go-version-file: katTasks-gui/go.mod
          cache-dependency-path: katTasks-gui/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: katTasks-gui/frontend/package-lock.json

      - name: Install Linux libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # wails3 is built without cgo: on Linux its cgo build needs GTK 4 and
      # WebKitGTK 6, which these runners don't have (the app uses GTK 3).
      - name: Install wails3 and task
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
          go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(git describe --tags --always | sed 's/^v//')-snapshot"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=katTasks-gui_${v}_${{ matrix.os }}_${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: matrix.test
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          wails3 generate bindings -f '-tags gtk3' -clean=true -ts -i
          npm run check --prefix frontend
          go test -tags gtk3 ./...

      # VERSION is passed in so a tidy go.sum or package-lock can't add -dirty.
      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: |
          task build VERSION=${{ steps.version.outputs.version }}
          d=${{ steps.version.outputs.name }}
          mkdir -p ../gui-dist "$d"
          cp bin/katTasks-gui build/linux/katTasks-gui.desktop build/appicon.png ../README.md "$d"/
          tar czf ../gui-dist/"$d".tar.gz "$d"

      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: |
          task windows:build ARCH=${{ matrix.arch }} VERSION=${{ steps.version.outputs.version }}
          d=${{ steps.version.outputs.name }}
          mkdir -p ../gui-dist "$d"
          cp bin/katTasks-gui.exe ../README.md "$d"/
          zip -r ../gui-dist/"$d".zip "$d"

      # The setup exe most Windows users want: both katTasks-gui.exe and
      # katTasks.exe, a Start Menu shortcut, the PATH entry, WebView2 if it's
      # missing and an uninstaller. Built by the repo-root Taskfile, which
      # also builds the CLI exe with its icon and version info.
      - name: Build the Windows installer
        if: matrix.installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          task -d .. build-win-installer VERSION=${{ steps.version.outputs.version }}
          cp ../bin/katTasks-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe ../gui-dist/

      - name: Build (macOS)
        if: matrix.os == 'darwin'
        run: |
          task darwin:package:universal VERSION=${{ steps.version.outputs.version }}
          mkdir -p ../gui-dist
          ditto -c -k --keepParent bin/katTasks-gui.app ../gui-dist/${{ steps.version.outputs.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}-${{ matrix.arch }}
          path: gui-dist/*
          retention-days: 7

  goreleaser:
    needs: gui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the history and tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Collect the desktop app archives
        uses: actions/download-artifact@v8
        with:
          pattern: gui-*
          path: gui-dist
          merge-multiple: true

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Keep dry-run archives
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            gui-dist/*
          retention-days: 7
