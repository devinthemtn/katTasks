# katTasks settings.
#
# Every setting is optional; anything left out uses the value shown here.
# Press Ctrl-r in katTasks to apply changes. Run katTasks -update-config after
# upgrading to add new settings to this file as comments.

# Color theme: a built-in ("default", "terminal", "nord", "gruvbox",
# "dracula") or the name of a file in the themes/ folder next to this file
# (without .toml).
# Press T in katTasks to pick one; katTasks -make-theme NAME writes a copy of
# the current theme to edit.
theme = "default"

[files]
# Your todo.txt. "~" and $VARIABLES are expanded. katTasks -file overrides it.
todo = "~/todo.txt"
# Where archived (completed) tasks go. Empty means done.txt next to todo.
done = ""

[tasks]
# Prefix new tasks with today's date.
add_creation_date = true
# Move tasks to the done file as soon as they are completed.
auto_archive = false

[view]
# Start with completed tasks hidden (H toggles).
hide_completed = true
# Starting sort: "priority", "due", "created" or "file" (s cycles).
sort = "priority"
# Show task numbers, the ones the command line uses (L toggles).
line_numbers = false
# key:value tags to hide from the task list, e.g. ["uid", "sync"]. They stay
# in the file and can still be searched.
hide_keys = []

[clipboard]
# Command that also receives copied text on stdin, e.g. "wl-copy", "xclip
# -selection clipboard" or "clip.exe" under WSL. Copying always uses the
# terminal's OSC 52 escape too; empty uses only that.
command = ""

[gui]
# katTasks-gui only; the terminal app uses your terminal's font.
# Font family for the window: one or more font names separated by commas,
# e.g. "Fira Code" or "Iosevka, Menlo"; the first one installed is used. A
# monospace font keeps the columns lined up. Empty uses the first installed
# of JetBrains Mono, Cascadia Mono, Consolas, DejaVu Sans Mono and Menlo,
# which also back up the family set here.
font_family = ""
# Text size in pixels, 8 to 48. ctrl+= and ctrl+- zoom for the session;
# ctrl+0 returns to this size.
font_size = 14

[alerts]
# Remind you of open tasks that have an at: time (at:1430, at:3pm), on their
# due: day, or every day if they have no due:. katTasks, katTasks-gui and
# katTasks remind (the background reminder; katTasks remind -install starts
# it at login) all watch the clock, and each alert goes off only once.
enabled = true
# How long before the at: time to alert, e.g. "0m", "10m", "1h".
lead = "10m"
# Show a desktop notification.
popup = true
# Play a sound.
sound = true
# A sound file to play instead of the system's notification sound. .wav
# works everywhere; .oga and .mp3 where the system player supports them.
sound_file = ""

[alarms]
# An alarm: tag rings like an alarm clock at a date and time:
# alarm:2026-12-01T0730. Typing alarm: while adding or editing a task opens
# a picker for it. Alarms are sent the same way as [alerts], by katTasks,
# katTasks-gui and katTasks remind.
enabled = true
# Show a desktop notification too.
popup = true
# How long the alarm rings, e.g. "10s", "30s", "2m".
ring = "30s"
# A sound file to ring with, played over and over. Empty uses katTasks's
# own alarm-clock beeping. .wav works everywhere.
sound_file = ""
# The time the picker starts at for a new alarm.
default_time = "7:00"

[keys]
# Rebind any action: name = "key" or ["key", "other key"]. Keys use names
# like "ctrl+u", "enter", "space", "tab"; two plain characters such as "gg"
# are a chord. A key you bind here stops doing its default action. Press :
# in katTasks to see every action name and its current keys.
# add = ["a", "n"]
# top = "gg"

[filters]
# Saved searches: name = "query". They show in the sidebar under SAVED.
# Press fs to save the current search, ff to jump to them.
# work-week = "+Work due:+1w"
# urgent = "pri:A-B -@waiting"
